<style>

/* Caderno de exercícios: trilha dos 10 dias à esquerda, folha de respostas à direita; no celular, a trilha vira faixa rolável no topo */
:root{
  --bg:#F3F4F7;
  --paper:#FFFFFF;
  --ink:#1C1F2A;
  --muted:#5F6577;
  --line:#DCDFE7;
  --accent:#0E6E6A;
  --accent-soft:#DDEFEC;
  --mark:#F2C94C;
  --p1:#0E6E6A;--p2:#3D7DD8;--p3:#B9558A;--p4:#D9902B;--p5:#6E5BC7;
  --display:"Sofia Sans Extra Condensed","Arial Narrow",sans-serif;
  --cond:"Sofia Sans Condensed","Arial Narrow",sans-serif;
  --body:"Sofia Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161D;--paper:#1C1F28;--ink:#E9EBF1;--muted:#A0A6B6;--line:#2E3240;
  --accent:#4FC2B8;--accent-soft:#163633;--mark:#E5BE4A;
  --p1:#4FC2B8;--p2:#6FA2EC;--p3:#D77FAE;--p4:#E8AA52;--p5:#9A89E6;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14161D;--paper:#1C1F28;--ink:#E9EBF1;--muted:#A0A6B6;--line:#2E3240;
  --accent:#4FC2B8;--accent-soft:#163633;--mark:#E5BE4A;
  --p1:#4FC2B8;--p2:#6FA2EC;--p3:#D77FAE;--p4:#E8AA52;--p5:#9A89E6;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:19px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:24px}
.brand small{display:block;font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;font-size:14px;color:var(--muted)}
.brand h1{margin:2px 0 0;font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,52px);line-height:1;letter-spacing:.01em;text-wrap:balance}
.overall{display:flex;align-items:center;gap:14px;font-family:var(--cond)}
.overall .bar{width:160px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.overall .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.overall b{font-variant-numeric:tabular-nums;font-size:24px}
.status{font-family:var(--cond);font-size:16px;color:var(--muted);min-width:9em;text-align:right}
.status.ok::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.status.warn::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mark);margin-right:6px;vertical-align:1px}

.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;align-items:start}
nav.trail{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:18px}
.pillar h2{margin:0 0 6px;font-family:var(--cond);font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
.pillar ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.daybtn{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;font-family:var(--cond);font-size:19px;line-height:1.2}
.daybtn:hover{background:var(--paper)}
.daybtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.daybtn .n{font-family:var(--display);font-weight:700;font-size:24px;width:30px;color:var(--muted);font-variant-numeric:tabular-nums}
.daybtn .pc{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.daybtn.on{background:var(--paper);box-shadow:inset 3px 0 0 var(--accent)}
.daybtn.on .n{color:var(--accent)}
.daybtn.done .pc{color:var(--accent);font-weight:600}

main.sheet{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,44px);min-width:0}
.sheet .eyebrow{font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;font-size:15px;color:var(--accent);font-weight:600}
.sheet h2.day{margin:4px 0 6px;font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,50px);line-height:1.05;text-wrap:balance}
.sheet .dayprog{font-family:var(--cond);color:var(--muted);font-size:17px;margin-bottom:8px}
.sec{margin-top:34px;padding-top:22px;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0;padding-top:0;margin-top:22px}
.sec>h3{margin:0 0 14px;font-family:var(--display);font-weight:600;font-size:32px;line-height:1.1}
.sub{margin:22px 0 8px;font-family:var(--cond);font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.item{margin:18px 0;max-width:72ch}
.q{font-weight:600;margin:0 0 4px}
.note{font-style:italic;color:var(--muted);font-size:17px;margin:0 0 8px}
textarea,input[type=text],input[type=number]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;resize:vertical}
textarea{min-height:96px;line-height:1.5}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent;background:var(--paper)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.lab{display:flex;flex-direction:column;gap:4px;font-family:var(--cond);font-size:17px;color:var(--muted);min-width:0}
.checks{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.checks label{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;padding:6px 8px;border-radius:8px;cursor:pointer}
.checks label:hover{background:var(--bg)}
.checks input{appearance:none;width:24px;height:24px;margin:3px 0 0;border:1.5px solid var(--muted);border-radius:5px;display:grid;place-content:center;cursor:pointer;background:var(--paper)}
.checks input:checked{background:var(--accent);border-color:var(--accent)}
.checks input:checked::after{content:"";width:10px;height:5px;border:2px solid var(--paper);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.checks input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.checks input:checked+span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;padding:14px;border:1px solid var(--line);border-radius:10px;margin:10px 0}
.pair .tag{grid-column:1/-1;font-family:var(--display);font-weight:600;font-size:22px;color:var(--accent)}
.pizza{display:flex;flex-wrap:wrap;gap:22px;align-items:center;margin-top:8px}
.pie{width:170px;height:170px;border-radius:50%;flex:none;background:var(--line);position:relative}
.pie::after{content:attr(data-total);position:absolute;inset:34%;border-radius:50%;background:var(--paper);display:grid;place-content:center;font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.pctrows{display:flex;flex-direction:column;gap:8px;flex:1;min-width:220px}
.pctrow{display:grid;grid-template-columns:16px minmax(0,1fr) 96px;gap:10px;align-items:center;font-family:var(--cond)}
.pctrow .sw{width:14px;height:14px;border-radius:4px}
.pctrow input{padding:6px 8px;text-align:right;font-variant-numeric:tabular-nums}
.pctrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pctmsg{font-family:var(--cond);font-size:17px;color:var(--muted)}
.pctmsg.bad{color:var(--p3)}
.formula{border-left:3px solid var(--mark);padding:6px 0 6px 14px;font-family:var(--cond);font-size:21px;margin:6px 0 10px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-top:40px;padding-top:20px;border-top:1px solid var(--line)}
button.btn{font:500 18px var(--cond);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 16px;cursor:pointer}
button.btn:hover{border-color:var(--accent)}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
button.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.btn[disabled]{opacity:.4;cursor:default}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);font-family:var(--cond);padding:9px 16px;border-radius:8px;font-size:18px}
.copybox{width:100%;min-height:160px;margin-top:10px}

@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);gap:16px}
  nav.trail{position:static;flex-direction:row;overflow-x:auto;gap:14px;padding-bottom:6px}
  .pillar{flex:none}
  .pillar ol{flex-direction:row}
  .daybtn{grid-template-columns:auto auto;width:auto;padding:8px 10px}
  .daybtn .t{display:none}
  .daybtn.on{box-shadow:inset 0 -3px 0 var(--accent)}
  .status{text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

body{margin:0;-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.backbtn{all:unset;cursor:pointer;font-family:var(--cond);font-size:18px;color:var(--accent);display:inline-flex;align-items:center;gap:6px;margin-bottom:6px}
.backbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.account{display:flex;align-items:center;gap:10px;font-family:var(--cond);font-size:16px;color:var(--muted);flex-wrap:wrap;justify-content:flex-end}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.home-intro{font-size:19px;color:var(--muted);max-width:60ch;margin:0 0 22px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;align-items:start}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.open{cursor:pointer}
.card.open:hover{border-color:var(--accent)}
.card h2{margin:0;font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05;overflow-wrap:anywhere}
.card .meta{font-family:var(--cond);font-size:17px;color:var(--muted)}
.card .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.card .bar i{display:block;height:100%;background:var(--accent)}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card .pct{font-family:var(--display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums}
.card .acts{display:flex;gap:16px;font-family:var(--cond);font-size:17px}
.card.new{border-style:dashed;background:transparent}
.card.new h2{font-size:30px}
.card form{display:flex;flex-direction:column;gap:10px}
.danger{color:var(--p3)}
.login{max-width:440px;margin:10vh auto 0;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:32px;display:flex;flex-direction:column;gap:14px}
.login h1{margin:0;font-family:var(--display);font-weight:700;font-size:40px;line-height:1}
.login p{margin:0;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>
<script>
/* ---------- conteúdo ---------- */
const P=["Clareza","Formato e planejamento","Execução","Lapidação"];
const q=(id,text,note,rows)=>({t:"q",id,text,note,rows});
const n=text=>({t:"n",text});
const s=text=>({t:"s",text});
const c=(id,items,text,note)=>({t:"c",id,items,text,note});
const f=(id,labels,text,note)=>({t:"f",id,labels,text,note});
const pairs=(id,count,a,b,tag)=>({t:"pairs",id,count,a,b,tag});

const DAYS=[
{p:0,title:"Qual a vibe do seu produto?",secs:[
 {h:"Moodboard",items:[
  c("d1.mood",["A vibe emocional do seu produto (leveza, força, foco, calma, praticidade etc.)","Cores que te representam ou que você quer associar ao produto","Palavras-chave ou frases que resumem a transformação","Texturas, ícones e estilos de fonte que combinem com a sua entrega"],"Monte um moodboard no Canva, em um quadro em branco no formato apresentação, com imagens que traduzam:"),
  q("d1.moodlink","Link ou observações do seu moodboard",null,2)]},
 {h:"A fórmula da ideia",items:[
  q("d1.ideia","O que exatamente você quer ensinar ou entregar?","Não vale dizer \"ajudar mulheres a viverem sua melhor versão\", porque isso não é um produto, é uma frase de bio do Instagram. Seja completamente livre, ninguém está te avaliando aqui e isso não é nada definitivo."),
  q("d1.problema","Essa ideia resolve qual problema específico? Ou ela torna algo que já era bom melhor? Ou os dois? O que o produto faz?","Se a resposta for \"ajudar\", já perdeu um ponto."),
  f("d1.persona",["Nome","Rotina","Drama","Boleto","Outras características"],"Para quem essa solução é feita?","A persona tem que existir fora da sua cabeça: nome, rotina, drama, boleto.")]}
]},
{p:0,title:"O que só você pode dizer",secs:[
 {h:"3 conselhos sinceros",items:[
  n("Escreva 3 conselhos pessoais sinceros que você daria para a sua persona, como se ela fosse sua amiga. Nada técnico, nada formal, só verdade prática que você gostaria que alguém tivesse te dito antes. Modelos: \"Se eu pudesse te dar um conselho hoje, seria: ___.\" / \"Se você está travada, tenta lembrar que ___.\" / \"Uma coisa que eu mesma precisei aprender na marra foi: ___.\""),
  q("d2.c1","Conselho 1",null,3),q("d2.c2","Conselho 2",null,3),q("d2.c3","Conselho 3",null,3),
  q("d2.metodo","Como esses 3 conselhos se aplicam na sua metodologia agora?")]}
]},
{p:0,title:"Microvitórias",secs:[
 {h:"O primeiro resultado",items:[
  q("d3.24h","Qual é o primeiro resultado visível que a pessoa pode conquistar em até 24 horas com o seu conteúdo?","Pode ser algo simples, como \"definir sua promessa\" ou \"entender seu problema com clareza\". Esse é o ponto de partida emocional."),
  q("d3.etapas","Como você pode dividir o seu conteúdo em etapas que gerem sensação de \"check\"?","Nomeie as etapas e crie marcos, por exemplo \"Etapa 1, Clareza\", \"Etapa 2, Organização\". Isso dá ao aluno a noção de progresso contínuo."),
  c("d3.avanco",["Checklists visuais","Frases como \"Se você chegou aqui, parabéns, já fez o que 80% das pessoas não fazem\"","Uma régua de progresso simples","Um \"antes e depois\" com exercícios aplicáveis"],"Como você pode mostrar esse avanço de forma simples?"),
  q("d3.avancoobs","Como você vai usar o que marcou",null,3)]}
]},
{p:1,title:"O novo lead, a mente do comprador",secs:[
 {h:"A mente do cliente que compra hoje",items:[
  n("Escreva 5 pensamentos que se passam na cabeça da sua persona antes de viver o que o seu produto entrega e, para cada pensamento, já vá pensando uma solução."),
  pairs("d4.pens",5,"Pensamento","Solução","Pensamento")]},
 {h:"Sinceridade brutal",items:[
  q("d4.acredita","O que seu cliente acredita sobre o problema dele antes de comprar seu produto?","Exemplos: \"acho que nunca vou conseguir organizar minha rotina\", \"isso não é para mim\", \"só gente disciplinada consegue\"."),
  q("d4.sente","O que ele sente sobre ele mesmo nessa fase?","Inseguro, ansioso, confuso, burro, incapaz? Se possível, com palavras dele mesmo."),
  q("d4.troca","Se ele pudesse trocar de vida com alguém hoje, anônimo ou famoso, com quais pessoas ele trocaria? Qual a rotina dessas pessoas?","Exemplo do material: trocaria de vida com a Jade Picon, porque ela é linda, faz esportes sempre, é magra, tem um rosto lindo etc."),
  q("d4.tentou","O que ele já tentou antes e não funcionou?","Cursos, métodos, dicas de Instagram, aplicativos milagrosos?"),
  q("d4.desistiu","Por que ele ainda não desistiu?","O que faz ele continuar buscando uma solução? Família? Sonho? Desespero?")]}
]},
{p:1,title:"Fatie os processos",secs:[
 {h:"Antes e depois",items:[
  q("d5.antes","Antes: como a sua persona pensa, sente e age antes de passar pelo seu método?","Sentimentos comuns (insegurança, confusão, desmotivação, medo), crenças limitantes (\"isso não é para mim\", \"nunca consigo manter uma rotina\"), comportamentos falhos ou travados (começa e para, procrastina, tenta sozinho e se frustra) e frases típicas que a persona fala ou pensa (\"eu não sei por onde começar\").",6),
  q("d5.depois","Depois: como ela será depois do seu método?","Novo estado emocional (mais confiante, mais focada, mais leve), mudança de mentalidade (agora ela acredita que pode, que sabe o que está fazendo), novas ações que agora consegue executar com clareza e resultados tangíveis ou sensações reais (criou seu conteúdo, organizou a rotina, vendeu o primeiro produto).",6)]},
 {h:"As 5 etapas",items:[
  f("d5.et",["Etapa 1","Etapa 2","Etapa 3","Etapa 4","Etapa 5"],"Liste em 5 etapas práticas como o seu cliente pode sair desse antes e atingir o depois."),
  {t:"pct",id:"d5.pct",names:"d5.et",fallback:"Etapa",text:"Desenhe as 5 etapas como uma pizza e coloque o percentual de cada uma.",note:"Os percentuais são fictícios, coloque mais ou menos."}]},

const $=s=>document.querySelector(s);
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const dayOf=id=>id.split(".")[0];
function lerLocal(){try{const o=JSON.parse(localStorage.getItem(LS)||"{}");return o&&typeof o==="object"?o:{};}catch(e){return {};}}
function gravarLocal(){try{localStorage.setItem(LS,JSON.stringify(produtos));}catch(e){}}
/* o Firebase não aceita ponto dentro do nome do campo, então troco por ~ ao gravar */
const enc=v=>{const o={};Object.keys(v||{}).forEach(k=>o[k.replace(/\./g,"~")]=v[k]);return o;};
const dec=v=>{const o={};Object.keys(v||{}).forEach(k=>o[k.replace(/~/g,".")]=v[k]);return o;};

/* ---------- progresso ---------- */
function fieldsOf(d){
  const out=[];
  d.secs.forEach(sec=>sec.items.forEach(it=>{
    if(it.t==="q")out.push(it.id);
    if(it.t==="c")it.items.forEach((_,i)=>out.push(it.id+"."+i));
    if(it.t==="f")it.labels.forEach((_,i)=>out.push(it.id+"."+i));
    if(it.t==="pairs")for(let i=0;i<it.count;i++){out.push(it.id+"."+i+".a");out.push(it.id+"."+i+".b");}
    if(it.t==="pct")for(let i=0;i<5;i++)out.push(it.id+"."+i);
    if(it.t==="formula")for(let i=0;i<5;i++)out.push("d10.form."+i);
  }));
  return out;
}
const ALLF=DAYS.map(fieldsOf);
const filledIn=(vals,id)=>{const v=vals[id];return v===true||(typeof v==="string"&&v.trim()!=="");};
function prog(i,vals){vals=vals||V;const fs_=ALLF[i];const k=fs_.filter(id=>filledIn(vals,id)).length;return{k,t:fs_.length,p:fs_.length?Math.round(k*100/fs_.length):0};}
function progTotal(vals){let k=0,t=0;DAYS.forEach((_,i)=>{const p=prog(i,vals);k+=p.k;t+=p.t;});return t?Math.round(k*100/t):0;}

/* ---------- rotas ---------- */
function lerHash(){
  const h=decodeURIComponent((location.hash||"").slice(1));
  const m=/^([A-Za-z0-9_-]+)(?:\/dia(\d+))?$/.exec(h);
  if(m&&produtos[m[1]]){atual=m[1];V=produtos[atual].v||(produtos[atual].v={});const d=m[2]?+m[2]-1:0;cur=d>=0&&d<DAYS.length?d:0;tela="caderno";}
  else{atual=null;tela="home";}
}
function irPara(h){if(location.hash!=="#"+h){location.hash=h;}else{lerHash();render();}}
window.addEventListener("hashchange",()=>{if(tela==="login")return;lerHash();render();window.scrollTo(0,0);});

/* ---------- telas ---------- */
function render(){
  if(tela==="login")return renderLogin();
  if(tela==="carregando"){$("#app").innerHTML=`<p class="note" style="margin-top:20vh;text-align:center">Abrindo os cadernos...</p>`;return;}
  if(tela==="caderno"&&atual&&produtos[atual])return renderCaderno();
  renderHome();
}
function contaHtml(){return usuario?`<span>${esc(usuario.email||usuario.displayName||"Conta Google")}</span><button class="linkbtn" data-sair>Sair</button>`:"";}
function statusHtml(){return `<span class="status" id="status"></span>`;}

function renderLogin(){
  $("#app").innerHTML=`<div class="login"><small style="font-family:var(--cond);text-transform:uppercase;letter-spacing:.14em;font-size:14px;color:var(--muted)">Info Essentials</small><h1>Cadernos de produto</h1><p>Entre com a sua conta Google para guardar as respostas e ver os mesmos cadernos no celular e no computador.</p><button class="btn primary" data-entrar ${entrando?"disabled":""}>${entrando?"Abrindo o Google...":"Entrar com o Google"}</button><p class="note">${esc(erroLogin||"Use sempre a mesma conta Google em todos os aparelhos.")}</p></div>`;
}

function fmtData(ts){if(!ts)return "";const d=new Date(ts);return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric"});}
function renderHome(){
  const ids=Object.keys(produtos).sort((a,b)=>(produtos[b].ts||0)-(produtos[a].ts||0));
  let h=`<header class="top"><div class="brand"><small>Lorena Mota · 4 pilares em 10 dias</small><h1>Meus produtos</h1></div><div class="account">${contaHtml()}${statusHtml()}</div></header>
  <p class="home-intro">Cada produto tem o próprio caderno com as atividades dos 10 dias do Info Essentials. Toque em um produto para continuar de onde parou.</p><div class="cards">`;
  ids.forEach(id=>{
    const p=produtos[id],pc=progTotal(p.v||{});
    if(renomeando===id){
      h+=`<div class="card"><form data-renomear="${id}"><label class="lab" for="ren-${id}">Novo nome do produto<input type="text" id="ren-${id}" value="${esc(p.nome)}" maxlength="80" required></label><div class="row"><button class="btn primary" type="submit">Salvar nome</button><button class="btn" type="button" data-cancelar>Cancelar</button></div></form></div>`;
    }else if(excluindo===id){
      h+=`<div class="card"><h2>${esc(p.nome)}</h2><p>Excluir este caderno apaga todas as respostas dele em todos os aparelhos. Não tem como desfazer.</p><div class="row"><button class="btn" data-excluir-sim="${id}" style="border-color:var(--p3);color:var(--p3)">Excluir de vez</button><button class="btn" data-cancelar>Cancelar</button></div></div>`;
    }else{
      h+=`<div class="card open" data-abrir="${id}" tabindex="0" role="link" aria-label="Abrir ${esc(p.nome)}"><h2>${esc(p.nome)}</h2><div class="row"><span class="pct">${pc}%</span><span class="meta">${p.ts?"Atualizado em "+fmtData(p.ts):""}</span></div><div class="bar"><i style="width:${pc}%"></i></div><div class="acts"><button class="linkbtn" data-renomear-btn="${id}">Renomear</button><button class="linkbtn danger" data-excluir="${id}">Excluir</button></div></div>`;
    }
  });
  h+=`<div class="card new"><h2>${ids.length?"Novo produto":"Seu primeiro produto"}</h2><form data-criar><label class="lab" for="novo-nome">Nome do produto<input type="text" id="novo-nome" maxlength="80" placeholder="Exemplo: Curso de IA para donas de negócio" required></label><button class="btn primary" type="submit" ${criando?"disabled":""}>Criar caderno</button></form></div></div>`;
  $("#app").innerHTML=h;
  updStatus();
}

function renderCaderno(){
  const p=produtos[atual];
  $("#app").innerHTML=`<header class="top"><div class="brand"><button class="backbtn" data-home>← Todos os produtos</button><small>Caderno Info Essentials</small><h1>${esc(p.nome)}</h1></div><div class="overall"><div class="bar"><i id="ovbar"></i></div><b id="ovpct">0%</b>${statusHtml()}</div></header>
  <div class="layout"><nav class="trail" id="trail" aria-label="Dias"></nav><main class="sheet" id="sheet"></main></div>`;
  renderTrail();renderDay();updStatus();
}

function renderTrail(){
  const el=$("#trail");if(!el)return;el.innerHTML="";
  P.forEach((name,pi)=>{
    const box=document.createElement("div");box.className="pillar";
    box.innerHTML=`<h2>${pi+1}. ${esc(name)}</h2><ol></ol>`;
    const ol=box.querySelector("ol");
    DAYS.forEach((d,di)=>{if(d.p!==pi)return;
      const pr=prog(di);
      const li=document.createElement("li");
      li.innerHTML=`<button class="daybtn${di===cur?" on":""}${pr.p===100?" done":""}" data-d="${di}" aria-current="${di===cur?"page":"false"}"><span class="n">${di+1}</span><span class="t">${esc(d.title)}</span><span class="pc">${pr.p}%</span></button>`;
      ol.appendChild(li);});
    el.appendChild(box);
  });
  el.querySelectorAll(".daybtn").forEach(b=>b.onclick=()=>irDia(+b.dataset.d));
  const op=progTotal(V);
  $("#ovbar").style.width=op+"%";$("#ovpct").textContent=op+"%";
}
function irDia(i){cur=i;irPara(atual+"/dia"+(i+1));}

function ta(id,rows){return `<textarea id="${id}" data-k="${id}" rows="${rows||4}">${esc(V[id]||"")}</textarea>`;}
function inp(id,ph){return `<input type="text" id="${id}" data-k="${id}" value="${esc(V[id]||"")}" ${ph?`placeholder="${esc(ph)}"`:""}>`;}
const COLORS=["var(--p1)","var(--p2)","var(--p3)","var(--p4)","var(--p5)"];
function pctName(it,i){
  const key=it.namesKey?`${it.names}.${i}.${it.namesKey}`:`${it.names}.${i}`;
  const v=(V[key]||"").trim();return v||`${it.fallback} ${i+1}`;
}
function renderItem(it){
  switch(it.t){
  case "q":return `<div class="item"><label class="q" for="${it.id}">${esc(it.text)}</label>${it.note?`<p class="note">${esc(it.note)}</p>`:""}${ta(it.id,it.rows)}</div>`;
  case "n":return `<div class="item"><p class="note">${esc(it.text)}</p></div>`;
  case "s":return `<div class="sub">${esc(it.text)}</div>`;
  case "c":return `<div class="item">${it.text?`<p class="q">${esc(it.text)}</p>`:""}${it.note?`<p class="note">${esc(it.note)}</p>`:""}<ul class="checks">${it.items.map((t,i)=>{const id=it.id+"."+i;return `<li><label><input type="checkbox" id="${id}" data-k="${id}" ${V[id]===true?"checked":""}><span>${esc(t)}</span></label></li>`;}).join("")}</ul></div>`;
  case "f":return `<div class="item">${it.text?`<p class="q">${esc(it.text)}</p>`:""}${it.note?`<p class="note">${esc(it.note)}</p>`:""}<div class="grid2">${it.labels.map((l,i)=>{const id=it.id+"."+i;return `<label class="lab" for="${id}">${esc(l)}${l.length>40?ta(id,2):inp(id)}</label>`;}).join("")}</div></div>`;
  case "pairs":{let h="";for(let i=0;i<it.count;i++){const a=`${it.id}.${i}.a`,b=`${it.id}.${i}.b`;h+=`<div class="pair"><div class="tag">${esc(it.tag)} ${i+1}</div><label class="lab" for="${a}">${esc(it.a)}${ta(a,2)}</label><label class="lab" for="${b}">${esc(it.b)}${ta(b,2)}</label></div>`;}return `<div class="item">${h}</div>`;}
  case "pct":return `<div class="item" data-pct="${it.id}"><p class="q">${esc(it.text)}</p>${it.note?`<p class="note">${esc(it.note)}</p>`:""}<div class="pizza"><div class="pie" role="img" aria-label="Pizza dos percentuais"></div><div class="pctrows">${[0,1,2,3,4].map(i=>{const id=it.id+"."+i;return `<div class="pctrow"><span class="sw" style="background:${COLORS[i]}"></span><span class="nm" data-nm="${it.id}.${i}">${esc(pctName(it,i))}</span><input type="number" min="0" max="100" inputmode="numeric" id="${id}" data-k="${id}" value="${esc(V[id]||"")}" placeholder="%" aria-label="Percentual ${i+1}"></div>`;}).join("")}<div class="pctmsg"></div></div></div></div>`;
  case "formula":return `<div class="item"><p class="q">Preencha a fórmula da promessa:</p><p class="formula">"Ajudo [persona] a sair de [problema] e alcançar [resultado desejado] com [método ou formato], mesmo que [objeção comum]."</p><div class="grid2">${["Persona","Problema","Resultado desejado","Método ou formato","Objeção comum"].map((l,i)=>{const id="d10.form."+i;return `<label class="lab" for="${id}">${l}${inp(id)}</label>`;}).join("")}</div><p class="note" style="margin-top:12px">Prévia: <span id="promprev"></span></p></div>`;
  }
  return "";
}
function renderDay(){
  const d=DAYS[cur],pr=prog(cur);
  let h=`<div class="eyebrow">Pilar ${d.p+1} · ${esc(P[d.p])}</div><h2 class="day">Dia ${cur+1}. ${esc(d.title)}</h2><div class="dayprog" id="dayprog">${pr.k} de ${pr.t} itens preenchidos</div>`;
  d.secs.forEach(sec=>{h+=`<section class="sec"><h3>${esc(sec.h)}</h3>${sec.items.map(renderItem).join("")}</section>`;});
  h+=`<div class="foot"><button class="btn" id="prev" ${cur===0?"disabled":""}>Dia anterior</button><div class="tools"><button class="btn" id="cpday">Copiar respostas do dia</button><button class="btn" id="cpall">Copiar tudo</button></div><button class="btn primary" id="next" ${cur===DAYS.length-1?"disabled":""}>Próximo dia</button></div><div id="cpwrap"></div>`;
  const sh=$("#sheet");sh.innerHTML=h;
  sh.querySelectorAll("[data-pct]").forEach(updatePie);
  updatePromise();
  $("#prev").onclick=()=>irDia(cur-1);$("#next").onclick=()=>irDia(cur+1);
  $("#cpday").onclick=()=>copy(exportDay(cur));
  $("#cpall").onclick=()=>copy(produtos[atual].nome.toUpperCase()+"\n\n"+DAYS.map((_,i)=>exportDay(i)).join("\n\n"));
}
function updatePie(box){
  const id=box.dataset.pct;let acc=0,stops=[];
  const vals=[0,1,2,3,4].map(i=>Math.max(0,parseFloat(V[id+"."+i])||0));
  const tot=vals.reduce((a,b)=>a+b,0);
  const base=Math.max(tot,100);
  vals.forEach((v,i)=>{if(!v)return;const a=acc/base*360,b=(acc+v)/base*360;stops.push(`${COLORS[i]} ${a}deg ${b}deg`);acc+=v;});
  const pie=box.querySelector(".pie");
  pie.style.background=stops.length?`conic-gradient(${stops.join(",")}${acc<base?`,var(--line) ${acc/base*360}deg 360deg`:""})`:"var(--line)";
  pie.dataset.total=Math.round(tot)+"%";
  const msg=box.querySelector(".pctmsg");
  if(!tot){msg.textContent="Distribua 100% entre as 5 partes.";msg.className="pctmsg";}
  else if(Math.round(tot)===100){msg.textContent="Soma certinha: 100%.";msg.className="pctmsg";}
  else{msg.textContent=tot<100?`Faltam ${Math.round(100-tot)}% para fechar 100%.`:`Passou ${Math.round(tot-100)}% de 100%.`;msg.className="pctmsg bad";}
}
function updatePromise(){
  const el=$("#promprev");if(!el)return;
  const g=i=>(V["d10.form."+i]||"").trim();
  const ph=["[persona]","[problema]","[resultado desejado]","[método ou formato]","[objeção comum]"];
  const p=i=>g(i)||ph[i];
  el.textContent=`"Ajudo ${p(0)} a sair de ${p(1)} e alcançar ${p(2)} com ${p(3)}, mesmo que ${p(4)}."`;
}
function findPct(key){const parts=key.split(".");const id=parts.slice(0,2).join("."),i=+parts[2];for(const day of DAYS)for(const s of day.secs)for(const it of s.items)if(it.t==="pct"&&it.id===id)return{it,i};return null;}

/* ---------- edição e gravação ---------- */
document.addEventListener("input",e=>{
  const k=e.target.dataset&&e.target.dataset.k;if(!k||!atual)return;
  V[k]=e.target.type==="checkbox"?e.target.checked:e.target.value;
  const box=e.target.closest("[data-pct]");if(box)updatePie(box);
  document.querySelectorAll("[data-nm]").forEach(sp=>{const it=findPct(sp.dataset.nm);if(it)sp.textContent=pctName(it.it,it.i);});
  if(k.startsWith("d10.form."))updatePromise();
  const pr=prog(cur);const dp=$("#dayprog");if(dp)dp.textContent=`${pr.k} de ${pr.t} itens preenchidos`;
  clearTimeout(trailT);trailT=setTimeout(renderTrail,250);
  marcar(atual);
});
let trailT=null;
function marcar(id){
  produtos[id].ts=Date.now();dirty.add(id);gravarLocal();
  updStatus("Salvando");
  clearTimeout(timer);timer=setTimeout(flush,900);
}
let statusTxt="";
function updStatus(t){
  if(t)statusTxt=t;
  const s=$("#status");if(!s)return;
  const txt=statusTxt||(col?"Salvo":"Salvo neste aparelho");
  s.textContent=txt;s.className="status "+(txt==="Salvo"?"ok":txt==="Salvando"?"":"warn");
}
async function flush(){
  if(!col){updStatus("Salvo neste aparelho");return;}
  if(saving||!dirty.size)return;
  saving=true;
  const ids=[...dirty];dirty.clear();
  try{
    for(const id of ids){const p=produtos[id];if(!p)continue;await col.doc(id).set({nome:p.nome,criadoEm:p.criadoEm||Date.now(),ts:p.ts||Date.now(),v:enc(p.v)});}
    updStatus("Salvo");
  }catch(e){ids.forEach(id=>dirty.add(id));updStatus("Salvo neste aparelho");}
  saving=false;
  if(dirty.size){clearTimeout(timer);timer=setTimeout(flush,1500);}
}

/* ---------- produtos ---------- */
function novoId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
document.addEventListener("submit",async e=>{
  e.preventDefault();
  const f=e.target;
  if(f.hasAttribute("data-criar")){
    const nome=$("#novo-nome").value.trim();if(!nome)return;
    const id=novoId();produtos[id]={nome,criadoEm:Date.now(),ts:Date.now(),v:{}};
    marcar(id);irPara(id+"/dia1");
  }
  if(f.dataset.renomear){
    const id=f.dataset.renomear,inp_=f.querySelector("input");const nome=inp_.value.trim();if(!nome)return;
    produtos[id].nome=nome;renomeando=null;marcar(id);renderHome();
  }
});
document.addEventListener("click",async e=>{
  const t=e.target.closest("button,[data-abrir]");if(!t)return;
  const ds=t.dataset;
  if("entrar" in ds)return entrar();
  if("sair" in ds){sair();return;}
  if("home" in ds){irPara("");return;}
  if(ds.renomearBtn){e.stopPropagation();renomeando=ds.renomearBtn;excluindo=null;renderHome();const i=$("#ren-"+renomeando);if(i){i.focus();i.select();}return;}
  if(ds.excluir){e.stopPropagation();excluindo=ds.excluir;renomeando=null;renderHome();return;}
  if("cancelar" in ds){renomeando=null;excluindo=null;renderHome();return;}
  if(ds.excluirSim){
    const id=ds.excluirSim;delete produtos[id];dirty.delete(id);excluindo=null;gravarLocal();renderHome();
    if(col){try{await col.doc(id).delete();toast("Caderno excluído");}catch(er){toast("Não consegui excluir no Firebase. Tente de novo com internet.");}}
    return;
  }
  if(ds.abrir){irPara(ds.abrir+"/dia1");return;}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.abrir)irPara(e.target.dataset.abrir+"/dia1");});

/* ---------- exportar ---------- */
function exportDay(i){
  const d=DAYS[i];const L=[`DIA ${i+1}. ${d.title.toUpperCase()}`];
  d.secs.forEach(sec=>{L.push("",sec.h);sec.items.forEach(it=>{
    if(it.t==="q")L.push(`${it.text}\n${(V[it.id]||"").trim()||"(em branco)"}`);
    if(it.t==="s")L.push(`[${it.text}]`);
    if(it.t==="c"){if(it.text)L.push(it.text);it.items.forEach((t,j)=>L.push(`${V[it.id+"."+j]?"[x]":"[ ]"} ${t}`));}
    if(it.t==="f"){if(it.text)L.push(it.text);it.labels.forEach((l,j)=>L.push(`${l}: ${(V[it.id+"."+j]||"").trim()}`));}
    if(it.t==="pairs")for(let j=0;j<it.count;j++)L.push(`${it.tag} ${j+1}. ${it.a}: ${(V[`${it.id}.${j}.a`]||"").trim()} | ${it.b}: ${(V[`${it.id}.${j}.b`]||"").trim()}`);
    if(it.t==="pct"){L.push(it.text);for(let j=0;j<5;j++)L.push(`${pctName(it,j)}: ${(V[it.id+"."+j]||"").trim()}%`);}
    if(it.t==="formula"){const g=j=>(V["d10.form."+j]||"").trim()||"___";L.push(`Fórmula da promessa: "Ajudo ${g(0)} a sair de ${g(1)} e alcançar ${g(2)} com ${g(3)}, mesmo que ${g(4)}."`);}
  });});
  return L.join("\n");
}
function copy(text){
  const done=()=>toast("Respostas copiadas");
  const fallback=()=>{const w=$("#cpwrap");w.innerHTML=`<p class="note">Não consegui copiar automaticamente. O texto está selecionado abaixo, use o comando de copiar do seu aparelho.</p><textarea class="copybox" id="cpbox" readonly></textarea>`;const b=$("#cpbox");b.value=text;b.focus();b.select();};
  try{navigator.clipboard.writeText(text).then(done,fallback);}catch(e){fallback();}
}
let toastT;function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2200);}

/* ---------- login com o Google e Firebase ---------- */
async function entrar(){
  erroLogin="";entrando=true;render();
  const prov=new firebase.auth.GoogleAuthProvider();
  prov.setCustomParameters({prompt:"select_account"});
  try{
    if(/\.firebaseapp\.com$/.test(location.hostname)){await auth.signInWithRedirect(prov);return;}
    await auth.signInWithPopup(prov);
  }catch(e){
    if(e&&(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment")){try{await auth.signInWithRedirect(prov);return;}catch(e2){e=e2;}}
    entrando=false;
    erroLogin=e&&e.code==="auth/popup-closed-by-user"?"A janela do Google foi fechada antes de terminar. Toque em Entrar com o Google para tentar de novo."
      :e&&e.code==="auth/unauthorized-domain"?"Este endereço ainda não está autorizado no Firebase. Inclua isabellavfortunato.github.io em Authentication, Settings, Authorized domains."
      :"Não consegui entrar com o Google"+(e&&e.code?" ("+e.code+")":"")+". Tente de novo.";
    render();
  }
}
function sair(){
  if(parar){parar();parar=null;}
  col=null;produtos={};try{localStorage.removeItem(LS);}catch(e){}
  if(auth)auth.signOut();
}
function conectar(u){
  if(parar){parar();parar=null;}
  usuario=u;
  col=fs.collection("usuarios").doc(u.uid).collection("cadernos");
  let primeira=true;
  parar=col.onSnapshot(snap=>{
    const vistos=new Set();
    let mudouAtual=false;
    snap.docs.forEach(d=>{
      const id=d.id;vistos.add(id);
      if(dirty.has(id))return;
      const r=d.data()||{};const loc=produtos[id];
      if(!loc||(r.ts||0)>(loc.ts||0)){
        produtos[id]={nome:r.nome||"Sem nome",criadoEm:r.criadoEm||0,ts:r.ts||0,v:dec(r.v)};
        if(id===atual&&!primeira)mudouAtual=true;
      }
    });
    if(primeira){
      // cadernos criados neste aparelho antes de entrar sobem para o Firebase
      Object.keys(produtos).forEach(id=>{if(!vistos.has(id))dirty.add(id);});
      if(dirty.size)flush();
    }else{
      Object.keys(produtos).forEach(id=>{if(!vistos.has(id)&&!dirty.has(id)&&!snap.metadata.hasPendingWrites)delete produtos[id];});
    }
    gravarLocal();
    const eraPrimeira=primeira;primeira=false;
    if(eraPrimeira||tela==="login"||tela==="carregando"){lerHash();render();updStatus("Salvo");return;}
    if(tela==="home"&&!renomeando&&!document.activeElement.matches("input"))renderHome();
    if(tela==="caderno"){
      if(!produtos[atual]){irPara("");return;}
      if(mudouAtual){V=produtos[atual].v;renderTrail();renderDay();toast("Respostas atualizadas de outro aparelho");}
    }
  },()=>{updStatus("Salvo neste aparelho");toast("Não consegui falar com o Firebase. As respostas continuam salvas neste aparelho.");});
}

/* ---------- início ---------- */
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
produtos=lerLocal();
if(window.firebase&&window.FIREBASE_CONFIG){
  try{
    const cfg=Object.assign({},window.FIREBASE_CONFIG);
    if(/\.firebaseapp\.com$/.test(location.hostname))cfg.authDomain=location.hostname;
    firebase.initializeApp(cfg);
    fs=firebase.firestore();
    fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    auth=firebase.auth();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
  }catch(e){fs=null;auth=null;}
}
if(fs&&auth){
  auth.getRedirectResult().catch(e=>{erroLogin="Não consegui entrar com o Google"+(e&&e.code?" ("+e.code+")":"")+".";render();});
  auth.onAuthStateChanged(u=>{
    entrando=false;
    if(u){tela="carregando";render();conectar(u);}
    else{usuario=null;col=null;tela="login";render();}
  });
}else{
  lerHash();
}
render();
</script>
